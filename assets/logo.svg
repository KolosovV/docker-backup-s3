<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-label="docker-backup-s3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2496ED"/>
      <stop offset="1" stop-color="#0EA5A4"/>
    </linearGradient>
  </defs>
  <!-- icon: three stacked storages (primary, secondary, tertiary) and a "backed up" check -->
  <rect x="12" y="12" width="96" height="96" rx="24" fill="url(#bg)"/>
  <rect x="26" y="26" width="52" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="26" y="46" width="52" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="26" y="66" width="52" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="34" cy="33" r="3.2" fill="#2496ED"/>
  <circle cx="34" cy="53" r="3.2" fill="#2496ED"/>
  <circle cx="34" cy="73" r="3.2" fill="#2496ED"/>
  <rect x="42" y="31.5" width="14" height="3" rx="1.5" fill="#2496ED" fill-opacity="0.35"/>
  <rect x="42" y="51.5" width="14" height="3" rx="1.5" fill="#2496ED" fill-opacity="0.35"/>
  <rect x="42" y="71.5" width="14" height="3" rx="1.5" fill="#2496ED" fill-opacity="0.35"/>
  <circle cx="82" cy="82" r="17" fill="#22C55E" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M74 82.5 l5.5 5.5 l10.5 -11" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark: colors readable on both light and dark backgrounds (one file, whatever theme the viewer has) -->
  <text x="130" y="76" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#2496ED">docker-backup<tspan fill="#0D9488">-s3</tspan></text>
</svg>

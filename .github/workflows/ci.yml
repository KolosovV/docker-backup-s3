name: CI

# Every push: ShellCheck, the tests, the integration test and a real VM with systemd (minutes).
# Release tags, the weekly run and a manual run also do every distribution, systemd as init in containers
# and aarch64 under QEMU (an hour and more): the heavy part, kept off ordinary pushes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (warnings and errors)
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR -S warning *.sh tests/*.sh tests/*/*.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          command -v jq || sudo apt-get install -y jq
          python3 --version
      - name: Tests
        run: tests/run.sh

  integration:
    # Real Docker and S3 (Versity Gateway): backup → verify → sync → wipe → restore → compare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          aws --version
          command -v jq gpg python3
      - name: Integration test
        run: tests/integration/run.sh

  vm:
    # The runner is a real VM: install.sh as a user runs it, the cron service, the systemd timer and service,
    # cron starting a backup on its own, removal
    name: real VM (systemd, cron)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scheduling on a real init
        run: sudo DBT_SRC="$PWD" tests/systemd/check.sh

  distros:
    # install.sh -y on a fresh system, then the tests and the integration test there
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:24.04
          - ubuntu:22.04
          - rockylinux:9
          - almalinux:8
          - fedora:41
          - amazonlinux:2023
          - opensuse/leap:15.6
          - archlinux:latest
          - alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - name: install.sh, tests and the integration test on ${{ matrix.image }}
        run: tests/distros/run.sh "${{ matrix.image }}"

  systemd:
    # systemd as PID 1 in a container of each distribution: the timer, the service, cron firing
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    name: systemd ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
          - rockylinux:9
          - almalinux:8
          - fedora:41
          - opensuse/leap:15.6
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Scheduling with systemd on ${{ matrix.image }}
        run: tests/systemd/run.sh "${{ matrix.image }}"

  arm64:
    # aarch64 under QEMU: the official AWS CLI for aarch64, the tools, the tests and the integration test
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    name: arm64 ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
          - rockylinux:9
          - alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: ${{ matrix.image }} on aarch64
        run: DBT_PLATFORM=linux/arm64 tests/distros/run.sh "${{ matrix.image }}"

name: CI

# Every push and pull request: ShellCheck, the tests, the integration test and a real VM with systemd (minutes).
# The heavy part — every distribution, systemd as init in containers, aarch64 under QEMU, real database servers (about two hours of
# runner time) — runs for the current release tag only (the one matching VERSION on main; re-pushed old tags
# get the light part), monthly, and by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Heavy suites to run'
        type: choice
        default: all
        options: [all, distros, systemd, arm64, databases, none]

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress; tag runs are left to finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.heavy.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (warnings and errors)
        run: |
          shellcheck --version
          shellcheck -x -P SCRIPTDIR -S warning ./*.sh tests/*.sh tests/*/*.sh
      - name: Which heavy suites run
        id: heavy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SUITE: ${{ inputs.suite }}
        run: |
          suites=""
          case "$EVENT" in
            schedule) suites="distros systemd arm64 databases" ;;
            workflow_dispatch)
              case "$SUITE" in
                all) suites="distros systemd arm64 databases" ;;
                none) ;;
                *) suites="$SUITE" ;;
              esac ;;
            push)
              if [[ "$REF" == refs/tags/* ]]; then
                git fetch -q --depth=1 origin main
                current="v$(git show FETCH_HEAD:VERSION | tr -d '[:space:]')"
                if [[ "${REF#refs/tags/}" == "$current" ]]; then suites="distros systemd arm64 databases"
                else echo "${REF#refs/tags/} is not the current release ($current): light part only"; fi
              fi ;;
          esac
          echo "heavy suites: ${suites:-none}"
          echo "suites=${suites}" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          command -v jq || sudo apt-get install -y jq
          python3 --version
      - name: Tests
        run: tests/run.sh

  integration:
    # Real Docker and S3 (Versity Gateway): backup → verify → sync → wipe → restore → compare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          aws --version
          command -v jq gpg python3
      - name: Integration test
        run: tests/integration/run.sh

  vm:
    # The runner is a real VM: install.sh as a user runs it, the cron service, the systemd timer and service,
    # cron starting a backup on its own, removal
    name: real VM (systemd, cron)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scheduling on a real init
        run: sudo DBT_SRC="$PWD" tests/systemd/check.sh

  distros:
    # install.sh -y on a fresh system, then the tests and the integration test there
    needs: shellcheck
    if: contains(needs.shellcheck.outputs.heavy, 'distros')
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:24.04
          - ubuntu:22.04
          - rockylinux:9
          - almalinux:8
          - fedora:41
          - amazonlinux:2023
          - opensuse/leap:15.6
          - archlinux:latest
          - alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - name: install.sh, tests and the integration test on ${{ matrix.image }}
        run: tests/distros/run.sh "${{ matrix.image }}"

  systemd:
    # systemd as PID 1 in a container of each distribution: the timer, the service, cron firing
    needs: shellcheck
    if: contains(needs.shellcheck.outputs.heavy, 'systemd')
    name: systemd ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
          - rockylinux:9
          - almalinux:8
          - fedora:41
          - opensuse/leap:15.6
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Scheduling with systemd on ${{ matrix.image }}
        run: tests/systemd/run.sh "${{ matrix.image }}"

  arm64:
    # aarch64 under QEMU: the official AWS CLI for aarch64, the tools, the tests and the integration test
    needs: shellcheck
    if: contains(needs.shellcheck.outputs.heavy, 'arm64')
    name: arm64 ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
          - rockylinux:9
          - alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: ${{ matrix.image }} on aarch64
        run: DBT_PLATFORM=linux/arm64 tests/distros/run.sh "${{ matrix.image }}"

  databases:
    # Dumps of real Postgres, MySQL, MariaDB, Redis, Valkey, KeyDB and MongoDB servers, several versions and ways
    # of passing the password; while they run, no password may appear on any process's command line
    needs: shellcheck
    if: contains(needs.shellcheck.outputs.heavy, 'databases')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Database dumps
        run: tests/databases/run.sh
